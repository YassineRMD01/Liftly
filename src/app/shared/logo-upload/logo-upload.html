<div class="space-y-4">
  <div class="flex flex-wrap items-center gap-4">
    <app-gym-logo [theme]="previewTheme()" [name]="name()" [size]="80" />
    <div class="flex flex-col gap-2">
      <div class="flex flex-wrap gap-2">
        <label pButton size="small" class="cursor-pointer" [class.opacity-60]="uploading()">
          <fa-icon icon="upload" />
          {{ (logoUrl() ? 'Change logo' : 'Upload logo') | t }}
          <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" class="sr-only" (change)="onFile($event)" [disabled]="uploading()" />
        </label>
        @if (logoUrl()) {
          <button pButton type="button" size="small" severity="danger" [text]="true" (click)="remove()"><fa-icon icon="trash" />{{ 'Remove' | t }}</button>
        }
      </div>
      <small class="muted">{{ 'PNG, JPG, SVG or WebP · square works best · resized to 256 px' | t }}</small>
    </div>
  </div>
  @if (colors().length) {
    <div>
      <div class="text-sm font-medium mb-2">{{ 'Colors from your logo' | t }}</div>
      <div class="flex flex-wrap gap-2">
        @for (c of colors(); track c) {
          <button type="button" (click)="pickColor.emit(c)" [attr.aria-label]="c" [attr.aria-pressed]="selectedColor() === c"
            class="flex items-center gap-2 ps-1 pe-3 py-1 rounded-full border border-surface-200 dark:border-surface-700 cursor-pointer text-xs font-mono hover:bg-surface-50 dark:hover:bg-surface-800"
            [class.!border-primary]="selectedColor() === c" [class.ring-1]="selectedColor() === c" [class.ring-primary]="selectedColor() === c">
            <span class="w-6 h-6 rounded-full" [style.background]="c"></span>{{ c }}
          </button>
        }
      </div>
    </div>
  }
</div>
