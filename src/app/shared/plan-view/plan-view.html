@let p = plan();
<div class="flex flex-wrap items-start gap-3 mb-3">
  <span class="w-10 h-10 rounded-xl grid place-items-center text-white shrink-0" [class.bg-orange-500]="p.kind === 'WORKOUT'" [class.bg-emerald-600]="p.kind === 'NUTRITION'">
    <fa-icon [icon]="p.kind === 'WORKOUT' ? 'dumbbell' : 'utensils'" />
  </span>
  <div class="flex-1 min-w-0">
    <h3 class="font-semibold">{{ p.title }}</h3>
    <div class="text-xs muted">{{ p.kind | t }} · {{ store.fullName(p.coachId) }} · {{ 'Updated' | t }} {{ p.updatedAt | date: 'mediumDate' }}</div>
  </div>
  <div class="w-32 text-xs text-end"><span class="font-semibold">{{ pct() }}%</span> {{ 'done' | t }}<p-progressbar [value]="pct()" [showValue]="false" class="!h-1.5 mt-1" /></div>
</div>
@if (p.notes) { <p class="text-sm muted mb-3 whitespace-pre-line">{{ p.notes }}</p> }
<div class="grid md:grid-cols-2 gap-3">
  @for (g of groups(); track g.name) {
    <div class="rounded-xl border border-surface-200 dark:border-surface-700 p-3">
      <h4 class="text-sm font-semibold mb-2">{{ g.name }}</h4>
      @for (i of g.items; track i.id) {
        <label class="flex items-start gap-2 py-1" [class.cursor-pointer]="canTick()">
          @if (canTick()) { <p-checkbox [binary]="true" [ngModel]="!!i.done" (ngModelChange)="store.toggleItem(p.id, i.id)" /> }
          @else { <fa-icon [icon]="i.done ? 'circle-check' : 'circle'" [class.text-green-600]="i.done" [class.text-surface-300]="!i.done" [class.dark:text-surface-600]="!i.done" class="mt-0.5" /> }
          <span class="text-sm" [class.line-through]="i.done" [class.opacity-60]="i.done"><span class="font-medium">{{ i.name }}</span>@if (i.detail) { <span class="block text-xs muted">{{ i.detail }}</span> }</span>
        </label>
      }
    </div>
  }
</div>
