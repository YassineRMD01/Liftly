<p-menu #menu [model]="items()" [popup]="true" appendTo="body">
  <ng-template #item let-item>
    <a class="flex items-center gap-2.5 px-3 py-2 cursor-pointer">
      <fa-icon [icon]="iconOf(item.id)" class="w-4 text-center" />
      <span class="flex-1">{{ item.label }}</span>
      @if (selected(item.id)) { <fa-icon icon="check" class="text-primary" /> }
    </a>
  </ng-template>
</p-menu>
<button pButton type="button" iconOnly [text]="true" [rounded]="true" severity="secondary" (click)="menu.toggle($event)" [pTooltip]="tooltip()" tooltipPosition="left" [attr.aria-label]="'Appearance' | t"><fa-icon [icon]="icon()" /></button>
