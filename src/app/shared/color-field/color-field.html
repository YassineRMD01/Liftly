<button type="button" (click)="pop.toggle($event)" class="inline-flex items-center gap-2 h-10 ps-1.5 pe-3 rounded-lg border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-900 hover:border-primary cursor-pointer"
  [attr.aria-label]="label() ?? ('Pick a color' | t)" data-testid="color-field">
  <span class="w-7 h-7 rounded-md border border-black/10" [style.background]="value()"></span>
  <span class="font-mono text-sm uppercase">{{ value() }}</span>
</button>
<p-popover #pop appendTo="body">
  <p-inputcolor class="w-60 flex flex-col gap-3" format="hsba" [ngModel]="value()" (onValueChange)="onChange($event)">
    <p-inputcolor-area class="h-36 rounded-lg">
      <p-inputcolor-area-background />
      <p-inputcolor-area-handle />
    </p-inputcolor-area>
    <p-inputcolor-slider channel="hue">
      <p-inputcolor-slider-track />
      <p-inputcolor-slider-handle />
    </p-inputcolor-slider>
    <div class="flex items-center gap-2">
      <p-inputcolor-swatch class="w-9 h-9 rounded-md shrink-0"><p-inputcolor-swatch-background /></p-inputcolor-swatch>
      <input pInputColorInput channel="hex" class="flex-1 font-mono uppercase" [attr.aria-label]="'Hex color' | t" />
    </div>
  </p-inputcolor>
</p-popover>
