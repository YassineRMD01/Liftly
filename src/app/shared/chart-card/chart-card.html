<section class="card h-full flex flex-col">
  <div class="flex items-start gap-3 mb-3">
    <div class="flex-1 min-w-0">
      <h2 class="font-semibold">{{ title() }}</h2>
      @if (subtitle()) { <p class="text-xs muted mt-0.5">{{ subtitle() }}</p> }
    </div>
    <button pButton type="button" iconOnly [text]="true" [rounded]="true" size="small" severity="secondary" (click)="showTable.set(!showTable())" [pTooltip]="(showTable() ? 'Show chart' : 'Show as table') | t" [attr.aria-label]="(showTable() ? 'Show chart' : 'Show as table') | t"><fa-icon [icon]="showTable() ? 'chart-column' : 'table'" /></button>
  </div>
  @if (showTable()) {
    <div class="overflow-auto" [style.max-height]="height()">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-start muted">
            <th class="py-1.5 font-medium text-start"></th>
            @for (s of series(); track s.label) { <th class="py-1.5 font-medium text-end">{{ s.label }}</th> }
          </tr>
        </thead>
        <tbody>
          @for (r of rows(); track r.label) {
            <tr class="border-t border-surface-100 dark:border-surface-800">
              <td class="py-1.5">{{ r.label }}</td>
              @for (v of r.values; track $index) { <td class="py-1.5 text-end tabular-nums">{{ v }}</td> }
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <div class="flex-1 min-h-0" role="img" [attr.aria-label]="title()">
      <p-chart [type]="type()" [data]="data()" [options]="options()" [height]="height()" />
    </div>
  }
</section>
