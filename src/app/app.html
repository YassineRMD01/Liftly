<router-outlet />
<p-toast position="top-right" />
<!-- confirmations use the same look as app-modal: gradient header bar, rounded card, pill buttons -->
<p-confirmdialog [style]="{ width: '26rem' }" [breakpoints]="{ '640px': '94vw' }" styleClass="!rounded-3xl !border-0 overflow-hidden">
  <ng-template #headless let-c let-onAccept="onAccept" let-onReject="onReject">
    @let danger = (c?.acceptButtonStyleClass ?? '').includes('danger');
    <div class="bg-surface-0 dark:bg-surface-900 rounded-3xl" data-testid="confirm-dialog">
      <div class="m-2 rounded-2xl px-4 py-3 bg-gradient-to-br flex items-center gap-3"
        [class]="danger ? 'from-red-500 to-rose-700 text-white' : 'from-primary-500 to-primary-800 text-primary-contrast'">
        <fa-icon [icon]="danger ? 'triangle-exclamation' : 'circle-question'" class="text-lg" />
        <span class="font-semibold flex-1 truncate">{{ c?.header ?? ('Please confirm' | t) }}</span>
        <button type="button" (click)="onReject()" class="w-8 h-8 shrink-0 rounded-full bg-white/20 hover:bg-white/30 cursor-pointer" [attr.aria-label]="'Close' | t"><fa-icon icon="xmark" /></button>
      </div>
      <p class="px-5 pt-2 pb-5 text-center">{{ c?.message }}</p>
      <div class="flex justify-center gap-2 px-5 pb-5">
        <button pButton type="button" [rounded]="true" severity="secondary" (click)="onReject()">{{ c?.rejectLabel ?? ('No' | t) }}</button>
        <button pButton type="button" [rounded]="true" [severity]="danger ? 'danger' : undefined" (click)="onAccept()" data-testid="confirm-accept">{{ c?.acceptLabel ?? ('Yes' | t) }}</button>
      </div>
    </div>
  </ng-template>
</p-confirmdialog>
