<app-page-header [title]="'My profile' | t" [subtitle]="'This is what gym admins and members see.' | t">
  <button pButton type="button" (click)="save()"><span pButtonLabel>{{ 'Save' | t }}</span></button>
</app-page-header>
<div class="grid lg:grid-cols-3 gap-6">
  <div class="lg:col-span-2 card space-y-4">
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="field"><label>{{ 'First name' | t }}</label><input pInputText [(ngModel)]="user.firstName" /></div>
      <div class="field"><label>{{ 'Last name' | t }}</label><input pInputText [(ngModel)]="user.lastName" /></div>
      <div class="field"><label>{{ 'Email' | t }}</label><input pInputText [(ngModel)]="user.email" /></div>
      <div class="field"><label>{{ 'Phone' | t }}</label><input pInputText [(ngModel)]="user.phone" /></div>
      <div class="field sm:col-span-2"><label>{{ 'Gender' | t }}</label><p-selectbutton [options]="genders" optionLabel="label" optionValue="value" [(ngModel)]="user.gender" /></div>
      <div class="field sm:col-span-2"><label>{{ 'Bio' | t }}</label><textarea pTextarea rows="4" [(ngModel)]="profile.bio"></textarea></div>
      <div class="field sm:col-span-2"><label>{{ 'Specialties (comma separated)' | t }}</label><input pInputText [(ngModel)]="specialties" [placeholder]="'Boxing, HIIT, Nutrition' | t" /></div>
      <div class="field"><label>{{ 'Years of experience' | t }}</label><p-inputnumber [(ngModel)]="profile.yearsExperience" [min]="0" [showButtons]="true" /></div>
      <div class="field"><label>{{ 'Hourly rate' | t }}</label><p-inputnumber [(ngModel)]="profile.hourlyRate" mode="currency" [currency]="profile.currency" [min]="0" /></div>
      <div class="field">
        <label>{{ 'Currency' | t }}</label>
        <p-select [options]="currencies()" optionLabel="label" optionValue="code" [(ngModel)]="profile.currency" [filter]="true" filterBy="label,code" styleClass="w-full" appendTo="body">
          <ng-template #item let-c><span class="font-mono font-semibold w-12 inline-block">{{ c.code }}</span>{{ c.label }}</ng-template>
          <ng-template #selectedItem let-c><span class="font-mono font-semibold me-2">{{ c.code }}</span>{{ c.label }}</ng-template>
        </p-select>
      </div>
    </div>
  </div>
  <div>
    <div class="text-sm font-semibold mb-2">{{ 'Public card' | t }}</div>
    <app-coach-card [coachId]="user.id" />
  </div>
</div>
